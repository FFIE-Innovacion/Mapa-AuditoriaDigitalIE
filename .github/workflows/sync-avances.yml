# .github/workflows/sync-avances.yml
#
# Corre todos los días a las 6:00 am Bogotá (11:00 UTC) y a mano desde la pestaña Actions ("Run workflow").
#
# Secrets (Settings → Secrets and variables → Actions):
#
#   Opción 1 · Entra ID (recomendada, la que gestiona TI):
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#     SP_FILE_PATH  → ruta de la Matriz dentro de "Documentos" del sitio SRVINNOVACIN2
#                     (o SP_FILE_NAME con solo el nombre del archivo, y el job lo busca)
#     SP_HOSTNAME / SP_SITE_PATH solo si cambia el sitio (default ffie3.sharepoint.com + /sites/SRVINNOVACIN2)
#
#   Opción 2 · Enlace anónimo de SharePoint:   MATRIZ_URL
#   Opción 3 · Pestaña en Google Sheets:       MATRIZ_CSV_URL
#   Opción 4 · Archivo subido al repo:         data/matriz_ffie.xlsx (sin secretos)
#
#   VISITAS_CSV_URL es opcional: si falta, usa el CSV publicado del Sheet (el mismo de los dashboards).

name: Sincronizar avances IE

on:
  schedule:
    - cron: "0 11 * * *"        # 6:00 am America/Bogota
  push:
    paths:
      - "data/matriz_ffie.xlsx"   # solo si alguien sube la Matriz al repo (opción 4)
  workflow_dispatch:
    inputs:
      prueba_con_sheet:
        description: "Prueba: usar la pestaña BASE_PM del Sheet como Matriz (sin SharePoint)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-avances
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los secretos se exponen al job como env: el contexto `secrets` no se puede usar en `if` de pasos.
    env:
      HAY_ENTRA:  ${{ secrets.AZURE_CLIENT_ID }}
      MATRIZ_URL: ${{ secrets.MATRIZ_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet openpyxl

      - name: "Opción 1 · Descargar Matriz vía Microsoft Graph (Entra ID)"
        if: ${{ env.HAY_ENTRA != '' }}
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SP_HOSTNAME:         ${{ secrets.SP_HOSTNAME }}
          SP_SITE_PATH:        ${{ secrets.SP_SITE_PATH }}
          SP_FILE_PATH:        ${{ secrets.SP_FILE_PATH }}
          SP_FILE_NAME:        ${{ secrets.SP_FILE_NAME }}
        run: python sync/descargar_matriz.py --out /tmp/matriz_ffie.xlsx

      - name: "Opción 2 · Descargar Matriz con enlace anónimo"
        if: ${{ env.HAY_ENTRA == '' && env.MATRIZ_URL != '' }}
        run: |
          sep='?'; case "$MATRIZ_URL" in *\?*) sep='&';; esac
          curl -fsSL --retry 3 -o /tmp/matriz_ffie.xlsx "${MATRIZ_URL}${sep}download=1"
          head -c 2 /tmp/matriz_ffie.xlsx | grep -q "PK" \
            || { echo "::error::SharePoint no devolvió un .xlsx (¿el enlace pide login?)"; exit 1; }

      - name: Elegir fuente de la Matriz
        id: matriz
        env:
          MATRIZ_CSV_URL: ${{ secrets.MATRIZ_CSV_URL }}
          PRUEBA: ${{ inputs.prueba_con_sheet }}
        run: |
          if [ "$PRUEBA" = "true" ]; then
            echo "arg=" >> "$GITHUB_OUTPUT"; echo "fuente: PRUEBA con BASE_PM del Sheet"
            echo "MATRIZ_CSV_URL=https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hh1EfZwAn2ziUXvPleW9dhW16K31BMFATqPgseuDQDqaz0Alk9Q95eAKVRiEk1E24cduIt4izdDe/pub?gid=1008068560&single=true&output=csv" >> "$GITHUB_ENV"
          elif [ -f /tmp/matriz_ffie.xlsx ]; then
            echo "arg=--matriz /tmp/matriz_ffie.xlsx" >> "$GITHUB_OUTPUT"; echo "fuente: SharePoint"
          elif [ -n "$MATRIZ_CSV_URL" ]; then
            echo "arg=" >> "$GITHUB_OUTPUT"; echo "fuente: Google Sheets (MATRIZ_CSV_URL)"
          elif [ -f data/matriz_ffie.xlsx ]; then
            echo "arg=--matriz data/matriz_ffie.xlsx" >> "$GITHUB_OUTPUT"; echo "fuente: archivo del repo"
          else
            echo "::error::No hay fuente para la Matriz. Configura los secretos de Entra ID (AZURE_*), MATRIZ_URL, MATRIZ_CSV_URL, o sube data/matriz_ffie.xlsx"; exit 1
          fi

      - name: Cruzar visitas + avance
        env:
          # Si no se define el secreto, usa el CSV publicado del Sheet (el mismo que ya usan los dashboards)
          VISITAS_CSV_URL: ${{ secrets.VISITAS_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hh1EfZwAn2ziUXvPleW9dhW16K31BMFATqPgseuDQDqaz0Alk9Q95eAKVRiEk1E24cduIt4izdDe/pub?gid=1008068560&single=true&output=csv' }}
          MATRIZ_CSV_URL: ${{ env.MATRIZ_CSV_URL || secrets.MATRIZ_CSV_URL }}
        run: python sync/sync_avances.py ${{ steps.matriz.outputs.arg }} --out data/avances.json

      - name: Publicar si cambió
        run: |
          git config user.name  "ffie-sync[bot]"
          git config user.email "innovacion@ffie.com.co"
          git add data/avances.json
          if git diff --cached --quiet; then
            echo "Sin cambios en avances.json"
          else
            git commit -m "sync: avances IE $(TZ=America/Bogota date +'%Y-%m-%d %H:%M')"
            git pull --rebase --quiet origin main || true
            git push
          fi
