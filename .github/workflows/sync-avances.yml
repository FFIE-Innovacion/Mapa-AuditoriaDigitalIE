# .github/workflows/sync-avances.yml
#
# Corre todos los días a las 6:00 am Bogotá (11:00 UTC), y también cada vez
# que se actualiza la Matriz en el repo (si Power Automate la sube) o a mano
# desde la pestaña Actions ("Run workflow").
#
# Secrets que hay que configurar en Settings → Secrets → Actions:
#   VISITAS_CSV_URL  → (opcional) CSV del Sheet de visitas; si falta, usa el publicado por defecto
#   MATRIZ_URL       → (opción A) enlace de descarga directa de la Matriz en SharePoint
#                      Si no está definido, se usa data/matriz_ffie.xlsx del repo (opción B).
#   MATRIZ_CSV_URL   → (opción C) si la matriz vive en una pestaña de Google Sheets

name: Sincronizar avances IE

on:
  schedule:
    - cron: "0 11 * * *"        # 6:00 am America/Bogota
  push:
    paths:
      - "data/matriz_ffie.xlsx"  # Power Automate subió una nueva Matriz
      - "sync/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-avances
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet openpyxl

      - name: Descargar Matriz desde SharePoint (opción A)
        if: ${{ secrets.MATRIZ_URL != '' }}
        env:
          MATRIZ_URL: ${{ secrets.MATRIZ_URL }}
        run: |
          curl -fsSL --retry 3 -o /tmp/matriz_ffie.xlsx "${MATRIZ_URL}&download=1"
          # Si SharePoint devolvió una página de login en vez del archivo, fallar aquí:
          file /tmp/matriz_ffie.xlsx | grep -qi "Microsoft Excel\|Zip archive" \
            || { echo "::error::SharePoint no devolvió un .xlsx (¿el enlace pide login?)"; exit 1; }

      - name: Elegir fuente de la Matriz
        id: matriz
        env:
          MATRIZ_URL: ${{ secrets.MATRIZ_URL }}
          MATRIZ_CSV_URL: ${{ secrets.MATRIZ_CSV_URL }}
        run: |
          if [ -n "$MATRIZ_URL" ]; then
            echo "arg=--matriz /tmp/matriz_ffie.xlsx" >> "$GITHUB_OUTPUT"
          elif [ -n "$MATRIZ_CSV_URL" ]; then
            echo "arg=" >> "$GITHUB_OUTPUT"
          elif [ -f data/matriz_ffie.xlsx ]; then
            echo "arg=--matriz data/matriz_ffie.xlsx" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No hay fuente para la Matriz (MATRIZ_URL, MATRIZ_CSV_URL o data/matriz_ffie.xlsx)"; exit 1
          fi

      - name: Cruzar visitas + avance
        env:
          # Si no se define el secreto, usa el CSV publicado del Sheet (el mismo que ya usan los dashboards)
          VISITAS_CSV_URL: ${{ secrets.VISITAS_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hh1EfZwAn2ziUXvPleW9dhW16K31BMFATqPgseuDQDqaz0Alk9Q95eAKVRiEk1E24cduIt4izdDe/pub?gid=1008068560&single=true&output=csv' }}
          MATRIZ_CSV_URL: ${{ secrets.MATRIZ_CSV_URL }}
        run: python sync/sync_avances.py ${{ steps.matriz.outputs.arg }} --out data/avances.json

      - name: Publicar si cambió
        run: |
          git config user.name  "ffie-sync[bot]"
          git config user.email "innovacion@ffie.com.co"
          git add data/avances.json
          if git diff --cached --quiet; then
            echo "Sin cambios en avances.json"
          else
            git commit -m "sync: avances IE $(TZ=America/Bogota date +'%Y-%m-%d %H:%M')"
            git push
          fi
