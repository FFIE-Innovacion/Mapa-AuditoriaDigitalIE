<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Control Digital FFIE</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --cy:#FDB913;--cb:#26408A;--cr:#D72229;
  --navy:#26408A;--navy2:#26408A;--navy3:#3366CC;
  --gold:#FDB913;--gold2:#E3A51E;
  --bg:#F4F6FB;--sur:#fff;--sur2:#F8FAFD;--brd:#DDE3F0;
  --txt:#1E3370;--mut:#666666;
  --ssm:0 1px 4px rgba(0,32,96,.08);--smd:0 4px 20px rgba(0,32,96,.12);
  --ve:#00843D;--vebg:#E6F4ED;--am:#D98A2B;--ambg:#FEF4DD;
  --ro:#D72229;--robg:#FDEAED;--gi:#7A8899;--gibg:#EEF1F5;--mo:#6A1B9A;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
/* LOADER */
#ldr{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#ldr.out{opacity:0;pointer-events:none}
.lt{font-family:'Work Sans',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;text-align:center}
.ls2{font-size:12px;color:rgba(255,255,255,.4);text-align:center}
.lbw{width:240px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.lb{height:100%;background:var(--gold);animation:lb 1.6s ease-in-out infinite}
@keyframes lb{0%{width:0}60%{width:80%}100%{width:100%}}
/* HEADER */
.hdr{background:var(--navy);position:sticky;top:0;z-index:200;box-shadow:0 3px 24px rgba(0,0,0,.22)}
.stripe{display:flex;height:5px}
.sy{flex:2;background:var(--cy)}.sbl{flex:1;background:var(--cb)}.srr{flex:1;background:var(--cr)}
.hm{display:flex;align-items:center;justify-content:space-between;padding:0 36px;height:68px}
.la{display:flex;align-items:center;gap:14px}
.ldv{width:1px;height:38px;background:rgba(255,255,255,.15)}
.ltx h1{font-family:'Work Sans',sans-serif;font-size:15px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.3px;line-height:1.2}
.ltx p{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.hr2{display:flex;align-items:center;gap:10px}
.hbg{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:6px 12px}
.hbl{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px}
.hbv{font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.rbtn{display:flex;align-items:center;gap:6px;background:rgba(253,185,19,.15);border:1px solid rgba(253,185,19,.4);border-radius:7px;padding:7px 13px;cursor:pointer;font-family:'Work Sans',sans-serif;font-size:12px;font-weight:700;color:var(--gold);transition:all .2s}
.rbtn:hover{background:rgba(253,185,19,.25)}
.rbtn.spin .ri{animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.lchip{display:flex;align-items:center;gap:6px;background:rgba(0,132,61,.2);border:1px solid rgba(0,132,61,.4);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;color:#4ddb8e;text-transform:uppercase;letter-spacing:1px}
.ldot{width:7px;height:7px;border-radius:50%;background:#4ddb8e;box-shadow:0 0 7px #4ddb8e;animation:bl 2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.hn{background:rgba(0,0,0,.25);display:flex;padding:0 36px;border-top:1px solid rgba(255,255,255,.06);overflow-x:auto}
.nb{display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;font-family:'Work Sans',sans-serif;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .18s;white-space:nowrap;text-transform:uppercase;letter-spacing:.8px}
.nb:hover{color:rgba(255,255,255,.8)}.nb.on{color:#fff;border-bottom-color:var(--gold)}
/* ERROR */
#err{background:var(--robg);border:1px solid var(--ro);border-left:4px solid var(--ro);border-radius:10px;padding:12px 18px;margin:16px 36px;display:none;align-items:center;gap:10px;font-size:13px;color:#8E1A1F}
/* WRAP */
.wrap{max-width:1480px;margin:0 auto;padding:24px 36px 60px}
.tab{display:none;animation:fu .3s ease both}.tab.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ub{display:flex;align-items:center;justify-content:space-between;background:var(--vebg);border:1px solid #A8D8BE;border-radius:10px;padding:9px 16px;margin-bottom:18px;font-size:12px}
.ubl{display:flex;align-items:center;gap:8px;color:var(--ve);font-weight:700}
.abar{background:linear-gradient(90deg,#FFF9E8,#FEF1CC);border:1px solid var(--gold2);border-left:4px solid var(--gold);border-radius:10px;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;color:#6B4A0A}
.st{display:flex;align-items:center;gap:10px;font-family:'Work Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--navy2);margin-bottom:14px}
.st::after{content:'';flex:1;height:1px;background:var(--brd)}.sa{width:14px;height:3px;border-radius:2px;background:var(--gold);flex-shrink:0}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--sur);border:1px solid var(--brd);border-radius:13px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--ssm);transition:all .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--smd)}
.kb{position:absolute;top:0;left:0;right:0;height:3px;border-radius:13px 13px 0 0}
.ki{font-size:20px;margin-bottom:6px}.kl{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);font-weight:700;margin-bottom:5px}
.kv{font-family:'Work Sans',sans-serif;font-size:36px;font-weight:800;line-height:1}.ks{font-size:10px;color:var(--mut);margin-top:5px}
/* LAYOUTS */
.g21{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-bottom:18px}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}
/* CARD */
.card{background:var(--sur);border:1px solid var(--brd);border-radius:15px;box-shadow:var(--ssm);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--sur2);border-bottom:1px solid var(--brd)}
.chl{display:flex;align-items:center;gap:9px}
.ct{font-size:13px;font-weight:700;color:var(--txt)}.cs{font-size:11px;color:var(--mut);margin-top:1px}
.cp{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--navy2);color:#fff}
.cpr{background:var(--ro)}.cb{padding:20px}
/* GAUGES */
.grow{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.gc{flex:1;min-width:120px;background:var(--sur);border:1px solid var(--brd);border-radius:13px;padding:16px;text-align:center;box-shadow:var(--ssm)}
.gv{font-family:'Work Sans',sans-serif;font-size:38px;font-weight:800;line-height:1}
.gl{font-size:10px;color:var(--mut);margin-top:4px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.gs{font-size:10px;color:var(--mut);margin-top:2px}
.gbw{height:6px;background:var(--brd);border-radius:3px;margin-top:10px;overflow:hidden}
.gbf{height:100%;border-radius:3px;transition:width .8s}
/* COORD BARS */
.cl{display:flex;flex-direction:column;gap:16px}
.cmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cname{font-size:12px;font-weight:700}.cpct{font-size:13px;font-weight:800;color:var(--navy2)}.cnn{font-size:11px;color:var(--mut)}
.sgb{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:1.5px}.sg{height:100%}
.sgl{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--brd)}
.sli{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);font-weight:600}
.sld{width:9px;height:9px;border-radius:2px;flex-shrink:0}
/* DONUT */
.dw{display:flex;flex-direction:column;align-items:center;gap:16px}
.dl{width:100%;display:flex;flex-direction:column}
.dr{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:7px;transition:background .15s}
.dr:hover{background:var(--sur2)}.drl{display:flex;align-items:center;gap:9px}
.dc{width:11px;height:11px;border-radius:3px;flex-shrink:0}.dlbl{font-size:12px;font-weight:600}
.drr{display:flex;align-items:center;gap:9px}.dn2{font-size:14px;font-weight:800}
.dp2{font-size:11px;color:var(--mut);min-width:34px;text-align:right}
/* INVERSION */
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ii{background:var(--sur2);border:1px solid var(--brd);border-radius:10px;padding:14px}
.iin{font-size:10px;font-weight:700;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.iiv{font-family:'Work Sans',sans-serif;font-size:22px;font-weight:800;color:var(--navy2)}
.iis{font-size:10px;color:var(--mut);margin-top:3px}
/* RANKING */
.rl{display:flex;flex-direction:column}
.ri{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--brd)}
.ri:last-child{border-bottom:none}
.rn{font-size:11px;font-weight:800;color:var(--mut);width:20px;text-align:center}
.rif{flex:1;min-width:0}.rna{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlo{font-size:10px;color:var(--mut);margin-top:1px}
.rbb{width:75px;height:5px;background:var(--brd);border-radius:3px;overflow:hidden}
.rbf{height:100%;border-radius:3px}.rp{font-size:12px;font-weight:800;width:36px;text-align:right}
/* REGION */
.rtg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.rt{background:var(--sur);border:1.5px solid var(--brd);border-radius:13px;padding:16px;cursor:pointer;transition:all .2s;box-shadow:var(--ssm)}
.rt:hover{border-color:var(--navy3);box-shadow:var(--smd);transform:translateY(-1px)}.rt.on{border-color:var(--navy2);background:#E6EFFD}
.rtn{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--navy2);margin-bottom:10px}
.rtk{display:flex;justify-content:space-between}
.rtkv{font-family:'Work Sans',sans-serif;font-size:20px;font-weight:800;color:var(--navy)}
.rtkl{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-top:1px;text-align:center}
.rtp{height:3px;background:var(--brd);border-radius:2px;margin-top:10px;overflow:hidden}
.rtpf{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--navy3),var(--cb))}
/* TABLE */
.tsc{max-height:450px;overflow-y:auto}
.dt{width:100%;border-collapse:collapse}
.dt th{text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);border-bottom:2px solid var(--brd);font-weight:800;background:var(--sur2);position:sticky;top:0;z-index:2}
.dt td{padding:9px 14px;border-bottom:1px solid var(--brd);vertical-align:middle}
.dt tr:hover td{background:#EEF3FD}.dt tr:last-child td{border-bottom:none}
.ien{font-size:12px;font-weight:700}.ies{font-size:10px;color:var(--mut);margin-top:1px}
/* PILLS */
.sp{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.sd{width:6px;height:6px;border-radius:50%}
.sv{background:var(--vebg);color:var(--ve)}.sv .sd{background:var(--ve)}
.sam{background:var(--ambg);color:var(--am)}.sam .sd{background:var(--am)}
.sro{background:var(--robg);color:var(--ro)}.sro .sd{background:var(--ro)}
.sgi{background:var(--gibg);color:var(--gi)}.sgi .sd{background:var(--gi)}
.et{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.tej{background:#E6EFFD;color:#3366CC}.tte{background:var(--vebg);color:var(--ve)}
.tsu{background:#FEF4DD;color:#D98A2B}.tre{background:#F3EBF9;color:var(--mo)}
.pr{display:flex;align-items:center;gap:7px}
.pb{width:65px;height:5px;background:var(--brd);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}.pv{font-size:11px;font-weight:800}
/* FILTERS */
.fb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.fl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:800}
.fbtn{padding:5px 13px;border-radius:20px;border:1.5px solid var(--brd);background:var(--sur);color:var(--mut);font-family:'Work Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.fbtn:hover{border-color:var(--navy3);color:var(--navy)}.fbtn.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.sbx{margin-left:auto;padding:7px 13px;border:1.5px solid var(--brd);border-radius:20px;font-family:'Work Sans',sans-serif;font-size:12px;color:var(--txt);outline:none;width:210px;transition:border .15s}
.sbx:focus{border-color:var(--navy3)}
/* RIESGOS */
.nal{color:var(--ro);font-weight:800;font-size:11px}.nme{color:var(--am);font-weight:700;font-size:11px}.nba{color:var(--ve);font-weight:700;font-size:11px}
.ea{background:var(--robg);color:var(--ro);font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.es2{background:var(--ambg);color:var(--am);font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.ec{background:var(--vebg);color:var(--ve);font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
/* PENDIENTES */
.don{color:var(--ve);font-weight:700;font-size:11px}.dov{color:var(--am);font-weight:700;font-size:11px}.dcr{color:var(--ro);font-weight:800;font-size:11px}
.emp{text-align:center;padding:44px 20px}.empi{font-size:46px;margin-bottom:12px}
.emph{font-size:15px;font-weight:700;margin-bottom:6px}.empp{font-size:13px;color:var(--mut);max-width:380px;margin:0 auto;line-height:1.6}
/* MCM TABLE */
.mt{width:100%;border-collapse:collapse}
.mt th{text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);border-bottom:2px solid var(--brd);font-weight:800;background:var(--sur2);position:sticky;top:0;z-index:2}
.mt td{padding:9px 14px;border-bottom:1px solid var(--brd);vertical-align:middle;font-size:12px}
.mt tr:hover td{background:#EEF3FD}.mt tr:last-child td{border-bottom:none}
/* FOOTER */
.fs{display:flex;height:4px}
.fy2{flex:2;background:var(--cy)}.fb2{flex:1;background:var(--cb)}.fr2{flex:1;background:var(--cr)}
.fb3{background:var(--navy);color:rgba(255,255,255,.4);text-align:center;padding:14px;font-size:11px}
.fb3 strong{color:rgba(255,255,255,.7)}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(4,1fr)}.g21,.g11,.g4{grid-template-columns:1fr}.rtg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  .wrap{padding:12px 10px 40px}
  .hm{padding:8px 12px;height:auto;flex-wrap:wrap;gap:8px}
  .hn{padding:0 8px}
  .ltx h1{font-size:12px}
  .ltx p{display:none}
  .hr2{flex-wrap:wrap;gap:6px;width:100%;justify-content:flex-start}
  .hbg{display:block;padding:4px 8px}
  .lchip{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}.kv{font-size:28px}
  .rtg{grid-template-columns:1fr 1fr}
  .grow{gap:8px}.gc{min-width:100px;padding:12px}.gv{font-size:30px}
  .tsc{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dt,.mt{min-width:640px}
  .cb{padding:14px}
  .fb .sbx{margin-left:0;width:100%}
  #mapaIE{height:62vh!important;min-height:400px!important}
  #mie-search{width:100%!important}
  #mie-sugg{width:calc(100vw - 60px)!important;max-width:320px}
  #mie-warn{max-width:180px;font-size:10px}
  .ig{grid-template-columns:1fr}
}

body{font-family:'Work Sans',sans-serif}
.hdr{background:#fff;box-shadow:0 2px 14px rgba(38,64,138,.12);border-bottom:1px solid var(--brd)}
.logo-ffie{height:52px;width:auto;display:block}
.ldv{background:var(--brd)}
.ltx h1{font-family:'Work Sans',sans-serif;color:var(--navy);font-weight:700;letter-spacing:0}
.ltx p{color:var(--mut)}
.hbg{background:#F4F6FB;border:1px solid var(--brd)}
.hbl{color:var(--mut)}.hbv{color:var(--navy)}
#mes-sel{color:var(--navy)!important}

.ldot{background:#00843D;box-shadow:none}

.nb{color:rgba(255,255,255,.65);font-family:'Work Sans',sans-serif}
.nb:hover{color:#fff}.nb.on{color:#fff;border-bottom-color:var(--gold)}

#ldr{background:#fff}

</style>
</head>
<body>

<div class="hdr">
  <div class="stripe"><div class="sy"></div><div class="sbl"></div><div class="srr"></div></div>

<script>
/* ══ AVANCE EN VIVO · Matriz FFIE (SharePoint) → GitHub Actions → data/avances.json ══
   El % de avance de cada sede se toma del JSON que genera el job diario (sync/sync_avances.py).
   Si el JSON no está disponible, todo sigue funcionando con el % del Sheet (comportamiento anterior). */
const AVANCES_URLS=[
  'data/avances.json',
  'https://raw.githubusercontent.com/FFIE-Innovacion/Mapa-AuditoriaDigitalIE/main/data/avances.json'
];
let AV={byDane:{},byName:{},meta:null};
function avNk(s){
  s=String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  s=s.replace(/\bI\s*E(?:\s*M)?\b/g,'IE').replace(/\bINSTITUCION EDUCATIVA\b/g,'IE');
  return s.replace(/\s+/g,' ').trim();
}
async function loadAvances(){
  for(const u of AVANCES_URLS){
    try{
      const r=await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
      if(!r.ok) continue;
      const j=await r.json(); if(!j||!Array.isArray(j.ies)) continue;
      const byDane={},byName={};
      j.ies.forEach(x=>{ if(x.dane) byDane[String(x.dane).trim()]=x; byName[avNk(x.ie)+'|'+avNk(x.sede)]=x; });
      AV={byDane,byName,meta:{generado_en:j.generado_en,mes_corte:j.mes_corte,fuente:j.fuente_avance,n:j.ies.length,url:u}};
      console.log('avances.json cargado desde',u,'·',j.ies.length,'sedes · generado',j.generado_en);
      return true;
    }catch(e){ console.warn('avances.json no disponible en',u,e.message); }
  }
  AV={byDane:{},byName:{},meta:null}; return false;
}
function avDe(dane,ie,sede){
  return AV.byDane[String(dane||'').trim()] || AV.byName[avNk(ie)+'|'+avNk(sede)] || null;
}
/* Aplica el avance en vivo a una fila de BASE_PM. Los meses ANTERIORES a la última
   visita conservan su histórico; desde el mes de la última visita en adelante manda la Matriz. */
function avAplicar(row){
  const a=avDe(row.dane,row.ie,row.sede);
  if(!a||a.avance_pct==null) return row;
  if(a.avance_mes&&row.mes&&row.mes<a.avance_mes) return row;
  row.avanceSheet=row.avance;
  row.avance=a.avance_pct;
  row.avanceFuente='sharepoint';
  row.avanceVisita=a.ultima_visita||null;
  row.avanceMes=a.avance_mes||null;
  row.avanceOrigen=a.avance_origen||null;
  return row;
}
function avCorteTxt(){
  if(!AV.meta||!AV.meta.generado_en) return '';
  const d=new Date(AV.meta.generado_en); if(isNaN(d)) return '';
  return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function avFechaTxt(iso){
  if(!iso) return '';
  const p=String(iso).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;
}

/* datos de obra (BASE_PM) para el avance en popups */
const U={ base:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hh1EfZwAn2ziUXvPleW9dhW16K31BMFATqPgseuDQDqaz0Alk9Q95eAKVRiEk1E24cduIt4izdDe/pub?gid=1008068560&single=true&output=csv' };
let D={base:[]};
function parseCSV(txt){
  const lines=txt.trim().split('\n');
  if(lines.length<2)return[];
  const hdrs=splitL(lines[0]);
  return lines.slice(1).map(l=>{
    const v=splitL(l),o={};
    hdrs.forEach((h,i)=>{ o[h.trim()]=(v[i]||'').replace(/^"|"$/g,'').trim(); });
    return o;
  }).filter(r=>Object.values(r).some(v=>v!==''));
}
function splitL(l){
  const v=[];let c='',q=false;
  for(const ch of l){
    if(ch==='"')q=!q;
    else if(ch===','&&!q){v.push(c.replace(/^"|"$/g,''));c='';}
    else c+=ch;
  }
  v.push(c.replace(/^"|"$/g,''));
  return v;
}
function mesDe(r){
  let v = r['Mes (YYYY-MM)'];
  if(v==null||v===''){ v = r['1']; }
  if(v==null||v===''){ v = r['1.0']; }
  if(v==null||v===''){
    for(const k in r){ const s=String(r[k]||'').trim(); if(/^\d{4}-\d{2}/.test(s)){ v=s; break; } }
  }
  return String(v||'').trim().slice(0,7);
}
function getBase(){
  return D.base.map(r=>({
    mes:      mesDe(r),
    coord:    r['COORDINACIÓN']         || r['COORDINACION'] || '',
    municipio:r['MUNICIPIO']            || '',
    dane:     r['CODIGO DANE SEDE']     || '',
    ie:       r['INSTITUCION EDUCATIVA']|| '',
    sede:     r['SEDE']                 || '',
    valor:    (()=>{ const raw=(r['VALOR TOTAL']||'').toString().replace(/[^0-9.]/g,''); const v=parseFloat(raw)||0; return v>1e12?0:v; })(),
    ambientes:(()=>{ const raw=(r['TOTAL AMBIENTES']||'').toString().replace(/[^0-9]/g,''); const v=parseInt(raw)||0; return v>10000?0:v; })(),
    estado:   r['ESTADO DEL ACTA']      || '',
    avance:   (()=>{ const raw=(r['% AVANCE EJECUTADO DE OBRA']||'0').replace('%','').replace(',','.').trim(); const v=parseFloat(raw)||0; return v>1?v:v*100; })(),
    semaforo: r['Semáforo PM']          || r['Semaforo PM'] || 'Gris',
    visitada: r['Visita Mes (Sí/No)']   || '',
  })).filter(r=>
    r.ie && r.ie.trim()!=='' &&
    r.ie!=='INSTITUCION EDUCATIVA' &&
    r.coord && r.coord.trim()!=='' &&
    r.coord!=='COORDINACIÓN'
  ).map(avAplicar);
}
function loadBase(){
  const pBase=fetch(U.base+'&_='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():Promise.reject(r.status))
    .then(t=>{D.base=parseCSV(t);})
    .catch(e=>{console.warn('BASE_PM no disponible:',e);D.base=[];});
  return Promise.all([pBase, loadAvances()]);
}
function mapaReload(){
  const b=document.getElementById('rbtn'); b.classList.add('spin');
  loadBase().then(()=>{mieLoad();setTimeout(()=>b.classList.remove('spin'),800);});
}
</script>

   Si medios.json no está disponible, todo funciona con los links del Sheet (comportamiento anterior). */
const MEDIOS_URLS=['data/medios.json','https://raw.githubusercontent.com/FFIE-Innovacion/Mapa-AuditoriaDigitalIE/main/data/medios.json'];
let MED={map:{},base:'',meta:null};
const MIE_VISREG=[];
function medK(s){ return mieNk(s).replace(/[^a-z0-9]+/g,' ').trim(); }
async function loadMedios(){
  for(const u of MEDIOS_URLS){
    try{
      const r=await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
      if(!r.ok) continue;
      const j=await r.json(); if(!j||!j.ies) continue;
      const map={}; Object.values(j.ies).forEach(e=>{ map[medK(e.ie)+'|'+medK(e.sede)]=e; });
      MED={map:map,base:j.base||'',meta:{generado:j.generado,url:u}};
      return true;
    }catch(e){ console.warn('medios.json no disponible en',u,e.message); }
  }
  MED={map:{},base:'',meta:null}; return false;
}
function medUrl(e,rel){ return encodeURI(MED.base+e.carpeta+'/'+rel).replace(/#/g,'%23'); }
function medCarpeta(e,rel){
  const m=MED.base.match(/^(https:\/\/[^/]+)\/(sites\/[^/]+)\/(.*)$/); if(!m) return '';
  const dir=('/'+m[2]+'/'+m[3]+e.carpeta+'/'+rel).replace(/\/[^/]+$/,'');
  return m[1]+'/'+m[2]+'/Shared%20Documents/Forms/AllItems.aspx?id='+encodeURIComponent(dir);
}
function mieIso(f){ const p=(f||'').split('/'); return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:''; }
function mieFmt(iso){ const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
/* Une Sheet + SharePoint en una lista de visitas por fecha */
function mieBuildVisitas(d){
  const V={};
  const get=iso=>(V[iso]=V[iso]||{iso:iso,f:mieFmt(iso),fotos:[],videos:[],v360:[],tl:[],carp:''});
  const add=(arr,key)=>(arr||[]).forEach(x=>{const iso=mieIso(x.f); if(iso) get(iso)[key].push(x.u);});
  add(d.vids,'videos'); add(d.v360,'v360'); add(d.tl,'tl'); add(d.fotos,'fotos');
  (d.carp||[]).forEach(x=>{const iso=mieIso(x.f); if(iso) get(iso).carp=x.u;});
  const e=MED.map[medK(d.ie)+'|'+medK(d.sede)];
  if(e){
    Object.keys(e.visitas).forEach(iso=>{
      const x=e.visitas[iso], v=get(iso);
      if(x.f&&x.f.length){ v.fotos=x.f.map(r=>medUrl(e,r)); v.carp=medCarpeta(e,x.f[0]); }
      if(x.v&&x.v.length){ v.videos=x.v.map(r=>medUrl(e,r)); }
    });
  }
  return Object.values(V).sort((a,b)=>a.iso.localeCompare(b.iso));
}

    +'<a href="'+MIE_VIDREG[i]+'" target="_blank" style="background:#FDB913;color:#1E3370;font-weight:800;border-radius:8px;padding:9px 18px;text-decoration:none;font-size:13px">Abrir en SharePoint ↗</a></div>';
  if(u.includes('embed.aspx')){
    body.innerHTML='<iframe src="'+u+'" allowfullscreen allow="autoplay; fullscreen" style="'+st+';background:#000"></iframe>';
  }else{
    const direct=mieDirectUrl(u);
    if(direct){
      body.innerHTML='<video controls autoplay playsinline style="'+st+';background:#000" src="'+direct.replace(/"/g,'&quot;')+'"></video>';
      body.querySelector('video').onerror=()=>{body.innerHTML=fallback;};
    }else{
      body.innerHTML=fallback;
    }
  }
}
function mieVideoClose(){
  const m=document.getElementById('mie-modal');
  if(m){m.style.display='none';document.getElementById('mie-modal-body').innerHTML='';}
}
function initMapaIE(){
  if(mieMap){ setTimeout(()=>mieMap.invalidateSize(),150); return; }
  mieMap=L.map('mapaIE',{zoomControl:true}).setView([4.6,-74.3],6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(mieMap);
  Object.keys(MIE_COLORS).forEach(k=>mieGroups[k]=L.layerGroup().addTo(mieMap));
  setTimeout(()=>mieMap.invalidateSize(),150);
  mieLoad();
}
function mieLoad(){
  Promise.all([fetch(MIE_CSV+'&t='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}),loadMedios().catch(()=>false)])
   .then(([txt])=>{
     const rows=mieParseCSV(txt),hdr=rows[0].map(mieNk);
     const col=n=>hdr.findIndex(h=>h.includes(n));
     const iDep=col('departamento'),iMun=col('municipio'),iIE=col('institucion'),iSede=col('sede'),
           iVis=col('visitas'),iEst=col('estado'),iLat=col('lat'),iLon=col('lon');
     const iVid=hdr.findIndex(h=>h.includes('video')&&!h.includes('360')&&!h.includes('timelapse'));const iV360=hdr.findIndex(h=>h.includes('360'));const iTl=hdr.findIndex(h=>h.includes('timelapse'));const iFot=hdr.findIndex(h=>h.includes('foto')&&!h.includes('carpeta'));const iCarp=hdr.findIndex(h=>h.includes('carpeta'));
     const data=[],missing=new Set();
     for(let r=1;r<rows.length;r++){const R=rows[r];
       if(!R||!R[iIE]||!String(R[iIE]).trim())continue;
       const vis=parseInt(R[iVis]); if(!vis&&vis!==0)continue;
       /* ubicacion por MUNICIPIO (tabla interna); LAT/LON del Sheets solo como respaldo */
       let lat=null,lon=null;
       const cM=MIE_COORDS[mieNk(R[iMun])];
       if(cM){ lat=cM[0]; lon=cM[1]; }
       else if(iLat>=0&&iLon>=0&&R[iLat]&&R[iLon]){
         lat=parseFloat(String(R[iLat]).replace(',','.'));lon=parseFloat(String(R[iLon]).replace(',','.'));
         if(lon>0) lon=-lon;
         if(isNaN(lat)||lat<-5||lat>14||lon<-80||lon>-66) lat=null;
       }
       if(lat===null||isNaN(lat)){missing.add(R[iMun]);continue;}
       data.push({dep:R[iDep],mun:R[iMun],ie:R[iIE],sede:R[iSede]||'',vis:vis,est:String(R[iEst]||'').trim(),lat:lat,lon:lon,cat:mieCat(R[iEst]),vids:mieVids(String((iVid>=0?R[iVid]:'')||'')),v360:mieVids(String((iV360>=0?R[iV360]:'')||'')),tl:mieVids(String((iTl>=0?R[iTl]:'')||'')),fotos:mieVids(String((iFot>=0?R[iFot]:'')||'')),carp:mieVids(String((iCarp>=0?R[iCarp]:'')||''))});
     }
     const g={}; data.forEach((d,i)=>{const k=d.lat.toFixed(4)+','+d.lon.toFixed(4);(g[k]=g[k]||[]).push(i);});
     Object.values(g).forEach(ix=>{ if(ix.length<2)return; const R=0.055;
       ix.forEach((idx,j)=>{const a=2*Math.PI*j/ix.length; data[idx].lat+=R*Math.cos(a); data[idx].lon+=R*Math.sin(a)*1.02;});});
     data.forEach(d=>{d.visitas=mieBuildVisitas(d);});
     MIE_DATA=data;
     mieMeses();
     mieApply();
     document.getElementById('mie-sync').textContent='Conectado a Google Sheets · actualizado '+new Date().toLocaleString('es-CO')+(MED.meta?' · Registro de campo al '+MED.meta.generado:'')+(AV.meta?' · Avance: Matriz FFIE al '+avCorteTxt():' · Avance: Sheet (Matriz no disponible)');
     if(missing.size){const w=document.getElementById('mie-warn');w.style.display='block';
       w.innerHTML='<b>Municipios sin coordenadas:</b> '+[...missing].join(', ')+'. Agrega columnas LAT y LON en el Sheets.';}
     mieHash();
   })
   .catch(e=>{document.getElementById('mie-sync').textContent='⚠️ No se pudo cargar el Sheets ('+e.message+')';});
}
function mieMeses(){
  const sel=document.getElementById('mie-mes'); if(!sel) return;
  const set=new Set();
  MIE_DATA.forEach(d=>(d.visitas||[]).forEach(v=>set.add(v.iso.slice(0,7))));
  const meses=[...set].sort();
  const NM={'01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};
  sel.innerHTML='<option value="">📅 Todos los meses</option>'+meses.map(m=>{const[y,mm]=m.split('-');return '<option value="'+m+'">'+NM[mm]+' '+y+'</option>';}).join('');
}
function mieToggleAlert(){
  MIE_ALERTONLY=!MIE_ALERTONLY;
  const b=document.getElementById('mie-alert-chip');
  b.style.background=MIE_ALERTONLY?'var(--ro)':'var(--sur)';
  b.style.color=MIE_ALERTONLY?'#fff':'var(--ro)';
  mieApply();
}
function mieApply(){
  const mes=document.getElementById('mie-mes')?document.getElementById('mie-mes').value:'';
  let data=MIE_DATA;
  if(mes) data=data.filter(d=>(d.visitas||[]).some(v=>v.iso.slice(0,7)===mes));
  const nAlert=MIE_DATA.filter(mieStale).length;
  const el=document.getElementById('mie-alert-n'); if(el) el.textContent=nAlert;
  if(MIE_ALERTONLY) data=data.filter(mieStale);
  const info=document.getElementById('mie-filter-info');
  if(info) info.textContent=(mes||MIE_ALERTONLY)?('Mostrando '+data.length+' de '+MIE_DATA.length+' sedes'):'';
  mieRender(data);
}
function mieSearch(q){
  const box=document.getElementById('mie-sugg');
  q=mieNk(q);
  if(!q||q.length<2){box.style.display='none';return;}
  const hits=MIE_DATA.filter(d=>mieNk(d.ie).includes(q)||mieNk(d.mun).includes(q)).slice(0,8);
  if(!hits.length){box.style.display='none';return;}
  box.innerHTML=hits.map(d=>'<div onclick="mieGoto(\''+mieSlug(d)+'\')" style="padding:8px 13px;cursor:pointer;border-bottom:1px solid #F0F2F7" onmouseover="this.style.background=\'#EEF3FD\'" onmouseout="this.style.background=\'#fff\'">'
    +'<div style="font-size:12px;font-weight:700;color:#1E3370">'+d.ie+'</div>'
    +'<div style="font-size:10px;color:#666666">'+d.mun+' · '+d.vis+' visita'+(d.vis==1?'':'s')+'</div></div>').join('');
  box.style.display='block';
}
function mieGoto(slug){
  const box=document.getElementById('mie-sugg'); if(box)box.style.display='none';
  const m=MIE_MARKERS[slug]; if(!m) return;
  const d=MIE_DATA.find(x=>mieSlug(x)===slug);
  Object.keys(mieGroups).forEach(k=>{if(!mieMap.hasLayer(mieGroups[k]))mieMap.addLayer(mieGroups[k]);});
  mieMap.flyTo([d.lat,d.lon],14,{duration:1.2});
  setTimeout(()=>m.openPopup(),1300);
}
function mieHash(){
  const h=location.hash.match(/#ie=([a-z0-9-]+)/);
  if(h&&MIE_MARKERS[h[1]]){
    const nav=document.querySelector(".nb[onclick*='mapa']");
    if(nav&&!document.getElementById('tab-mapa').classList.contains('on')) nav.click();
    setTimeout(()=>mieGoto(h[1]),600);
  }
}
function mieRender(DATA){
  Object.values(mieGroups).forEach(gr=>gr.clearLayers());
  MIE_MARKERS={};
  DATA.forEach(d=>{
    const c=MIE_COLORS[d.cat]||MIE_COLORS.otro;
    const stale=mieStale(d);
    const size=30+Math.min(d.vis,5)*6;
    const ring=stale?'#D72229':'#fff';
    const icon=L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size],popupAnchor:[0,-size],
      html:'<div style="position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;'
        +'border:3px solid '+ring+';border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(0,0,0,.35);'
        +'width:'+size+'px;height:'+size+'px;background:'+c+';font-family:Work Sans,sans-serif">'
        +'<span style="transform:rotate(45deg);font-size:12px">'+d.vis+'</span>'
        +(stale
          ?'<div style="position:absolute;top:-8px;right:-8px;transform:rotate(45deg);background:#D72229;color:#fff;border:2px solid #fff;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center">!</div>'
          :'<div style="position:absolute;top:-8px;right:-8px;transform:rotate(45deg);background:#00843D;color:#fff;border:2px solid #fff;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center">✓</div>')
        +'</div>'});
    const m=L.marker([d.lat,d.lon],{icon:icon});
    const dias=mieDias(d);
    const slug=mieSlug(d);
    const obra=mieObra(d);
    let obraHtml='';
    if(obra){
      const av=obra.avance||0, col=av>=75?'#00843D':av>=40?'#D98A2B':'#D72229';
      obraHtml='<div style="margin-top:7px;border-top:1px solid #DDE3F0;padding-top:7px">'
        +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:#666666;font-weight:700">Avance de obra</span><span style="font-weight:800;color:'+col+'">'+av.toFixed(1)+'%</span></div>'
        +'<div style="height:6px;background:#DDE3F0;border-radius:3px;overflow:hidden"><div style="width:'+Math.min(av,100)+'%;height:100%;background:'+col+'"></div></div>'
        +(obra.avanceFuente==='sharepoint'
            ?'<div style="font-size:10px;color:#666666;margin-top:4px">Matriz FFIE'+(obra.avanceVisita?' · visita '+avFechaTxt(obra.avanceVisita):'')+(avCorteTxt()?' · actualizado '+avCorteTxt():'')+'</div>'
            :'<div style="font-size:10px;color:#9AA5BD;margin-top:4px">Fuente: Sheet de visitas</div>')
        +(obra.coord?'<div style="font-size:11px;margin-top:5px"><b>Coordinación:</b> '+obra.coord+'</div>':'')
        +'</div>';
    }
    m.bindPopup('<div style="font-family:Work Sans,sans-serif;min-width:250px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
      +'<div style="font-weight:800;color:#26408A;font-size:13px;margin-bottom:5px">'+d.ie+'</div>'
      +'<a href="javascript:void(0)" id="mie-share-'+slug+'" onclick="mieShare(\''+slug+'\')" style="flex-shrink:0;font-size:10px;font-weight:700;color:#26408A;text-decoration:none;border:1px solid #DDE3F0;border-radius:6px;padding:3px 7px;white-space:nowrap">🔗 Copiar link</a></div>'
      +(d.sede?'<div style="font-size:12px"><b>Sede:</b> '+d.sede+'</div>':'')
      +'<div style="font-size:12px"><b>Municipio:</b> '+d.mun+'</div>'
      +'<div style="font-size:12px"><b>Zona:</b> '+d.dep+'</div>'
      +'<div style="margin-top:6px"><span style="background:#FDB913;color:#1E3370;font-weight:800;border-radius:20px;padding:2px 10px;font-size:12px">'+d.vis+' visita'+(d.vis==1?'':'s')+'</span> '
      +'<span style="color:'+c+';border:1px solid '+c+';border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700">'+(MIE_LABELS[d.cat]||d.est)+'</span>'
      +(stale?' <span style="background:#FDEAED;color:#D72229;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:800">⚠ '+dias+' días sin vuelo</span>':'')
      +'</div>'
      +obraHtml
      +mieVisitas(d)+'</div>',{maxWidth:320});
    MIE_MARKERS[slug]=m;
    mieGroups[d.cat].addLayer(m);
  });
  const ies=new Set(DATA.map(d=>String(d.ie).trim().toUpperCase()));
  const muns=new Set(DATA.map(d=>mieNk(d.mun)));
  const tot=DATA.reduce((a,d)=>a+d.vis,0);
  const chip=(n,l)=>'<div style="background:var(--sur2);border:1px solid var(--brd);border-radius:8px;padding:6px 12px;text-align:center">'
    +'<div style="font-family:\'Work Sans\',sans-serif;font-size:20px;font-weight:800;color:var(--navy2);line-height:1">'+n+'</div>'
    +'<div style="font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:700">'+l+'</div></div>';
  document.getElementById('mie-stats').innerHTML=chip(ies.size,'IE')+chip(DATA.length,'Sedes')+chip(muns.size,'Municipios')+chip(tot,'Visitas');
  if(DATA.length&&!location.hash.includes('ie=')) mieMap.fitBounds(L.latLngBounds(DATA.map(d=>[d.lat,d.lon])),{padding:[50,50]});
}

loadBase().then(()=>initMapaIE());
setInterval(()=>{loadBase().then(()=>mieLoad());}, 5*60*1000);
</script>
